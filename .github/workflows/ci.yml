name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-policy:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify repository path policy
        shell: pwsh
        run: ./build/Verify-RepositoryPolicy.ps1

      - name: Verify scientific source boundary
        shell: pwsh
        run: ./build/Verify-ScientificSourceBoundary.ps1

      - name: Restore locked dependencies
        run: dotnet restore FluoAxis.slnx --locked-mode

      - name: Generate dependency, license, and SBOM evidence
        shell: pwsh
        run: ./build/Generate-DependencyEvidence.ps1

      - name: Build
        run: dotnet build FluoAxis.slnx --no-restore

      - name: Verify executable DPI awareness
        shell: pwsh
        run: ./build/Verify-WindowsDpi.ps1 -Executable 'src/FluoAxis.App/bin/Debug/net10.0-windows10.0.22621.0/win-x64/FluoAxis.App.exe'

      - name: Publish and verify WinUI runtime assets
        shell: pwsh
        run: |
          dotnet publish src/FluoAxis.App/FluoAxis.App.csproj -c Release --no-restore -o artifacts/ci/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/Verify-PublishedAssets.ps1 -PublishDirectory artifacts/ci/publish
          ./build/Verify-WindowsDpi.ps1 -Executable artifacts/ci/publish/FluoAxis.App.exe

      - name: Test local PlotHost
        run: node --test web/FluoAxis.PlotHost/plot-host.test.js

      - name: Test with fail-closed discovery
        shell: pwsh
        run: dotnet test --test-modules '**/bin/Debug/net10.0*/**/*Tests.dll' --root-directory . --minimum-expected-tests 1010
